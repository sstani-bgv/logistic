# Прод: docker compose up -d --build   (.env лежит рядом, только на сервере)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      COOKIE_SECURE: "1"
      DEMO_SEED: "0"
      LLM_PROXY_MODE: ""
      TELEPHONY: ${TELEPHONY:-off}   # пока нет ВАТС — звонков нет (mock на проде не нужен: расшифровки выдуманные)
      BACKUP_DIR: /backups
    volumes:
      - data:/data            # data.db и записи звонков (recordings/)
      - backups:/backups:ro   # только отметки last_ok/last_error — показать владельцу, что бэкап жив
    expose: ["8010"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE: ${SITE:?укажите SITE в .env — домен или <ip>.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    security_opt: ["no-new-privileges:true"]

  backup:
    build: ./deploy/backup
    restart: unless-stopped
    # ключи хранилища — в отдельном backup.env (см. backup.env.example): приложению они не нужны и не видны.
    # Ключи LLM/ВАТС/АТИ сюда не попадают.
    env_file:
      - path: backup.env
        required: false
    environment:
      TZ: Europe/Moscow
      BACKUP_AT: ${BACKUP_AT:-03:30}
      KEEP_DAYS: ${KEEP_DAYS:-14}
    security_opt: ["no-new-privileges:true"]
    volumes:
      - data:/data
      - backups:/backups

  # Голос (ТЗ 2.2): релей Yandex Realtime уже внутри app (server/voice.py, тестовый звонок из браузера).
  # После доступа к ВАТС SIP-адаптер (регистрация сотрудника-бота, 8 кГц ⇄ 44,1 кГц) станет отдельным сервисом
  # с тем же образом: `command: python sip_bot.py` — и будет звать voice.talk().

volumes:
  data:
  backups:
  caddy_data:
  caddy_config:
