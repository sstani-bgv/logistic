# Прод: docker compose up -d --build   (.env лежит рядом, только на сервере)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      COOKIE_SECURE: "1"
      DEMO_SEED: "0"
      LLM_PROXY_MODE: ""
    volumes:
      - data:/data            # data.db и записи звонков (recordings/)
    expose: ["8010"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE: ${SITE:?укажите SITE в .env — домен или <ip>.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    security_opt: ["no-new-privileges:true"]

  backup:
    build: ./deploy/backup
    restart: unless-stopped
    # только то, что нужно бэкапу — ключи LLM/ВАТС/АТИ сюда не попадают
    environment:
      TZ: Europe/Moscow
      BACKUP_AT: ${BACKUP_AT:-03:30}
      KEEP_DAYS: ${KEEP_DAYS:-14}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      RCLONE_CONFIG_S3_TYPE: ${RCLONE_CONFIG_S3_TYPE:-}
      RCLONE_CONFIG_S3_PROVIDER: ${RCLONE_CONFIG_S3_PROVIDER:-}
      RCLONE_CONFIG_S3_ENDPOINT: ${RCLONE_CONFIG_S3_ENDPOINT:-}
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${RCLONE_CONFIG_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_S3_SERVER_SIDE_ENCRYPTION: ${RCLONE_CONFIG_S3_SERVER_SIDE_ENCRYPTION:-}
    security_opt: ["no-new-privileges:true"]
    volumes:
      - data:/data
      - backups:/backups

  # Голосовой бот (ТЗ 2.2) — отдельный сервис, подключим после спайка с ВАТС:
  # voice:
  #   build: ./voice
  #   restart: unless-stopped
  #   env_file: .env

volumes:
  data:
  backups:
  caddy_data:
  caddy_config:
